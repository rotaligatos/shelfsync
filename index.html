<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ShelfSync</title>
<meta name="theme-color" content="#0F6B5A">
<meta name="description" content="ShelfSync — depot inventory, sales and replenishment for WCLI and CWLI Modern Trade">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ShelfSync">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: phone-first app shell. Promodiser = single column + bottom tab bar; Plant = left rail + wide work area. */
:root{
  --bg:#F1F4F3; --surface:#FFFFFF; --surface-2:#E7ECEA; --line:#D3DBD8;
  --ink:#12201C; --ink-2:#4A5A54; --ink-3:#77857F;
  --accent:#0F6B5A; --accent-ink:#FFFFFF; --accent-soft:#DCEEE8;
  --good:#1E7F48; --good-soft:#DDF1E4; --warn:#9A6200; --warn-soft:#FBEBCB;
  --crit:#B93A26; --crit-soft:#F8DED8; --info:#2A6FC2; --info-soft:#DDE8F7;
  --series-1:#2a78d6; --series-band:rgba(42,120,214,.14); --grid:#E2E8E5;
  --shadow:0 1px 2px rgba(18,32,28,.06),0 4px 14px rgba(18,32,28,.05);
  --f-display:"Archivo","Segoe UI",system-ui,sans-serif;
  --f-body:"Public Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:10px; --r-sm:7px;
  --tabbar-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#151D1A; --surface-2:#1D2723; --line:#2A3631;
  --ink:#E6EEEA; --ink-2:#A8B6B0; --ink-3:#7A8983;
  --accent:#3DB399; --accent-ink:#06211B; --accent-soft:#163830;
  --good:#53C487; --good-soft:#163424; --warn:#E3A73F; --warn-soft:#3A2C10;
  --crit:#F06C56; --crit-soft:#3E1C16; --info:#6EA6EE; --info-soft:#18283D;
  --series-1:#3987e5; --series-band:rgba(57,135,229,.2); --grid:#24302B;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#151D1A; --surface-2:#1D2723; --line:#2A3631;
  --ink:#E6EEEA; --ink-2:#A8B6B0; --ink-3:#7A8983;
  --accent:#3DB399; --accent-ink:#06211B; --accent-soft:#163830;
  --good:#53C487; --good-soft:#163424; --warn:#E3A73F; --warn-soft:#3A2C10;
  --crit:#F06C56; --crit-soft:#3E1C16; --info:#6EA6EE; --info-soft:#18283D;
  --series-1:#3987e5; --series-band:rgba(57,135,229,.2); --grid:#24302B;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.5rem;font-weight:800}
h2{font-size:1.12rem;font-weight:700}
h3{font-size:.95rem;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.82em;letter-spacing:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}
.small{font-size:.82rem}
.eyebrow{font-size:.7rem;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--ink-3)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.stack{display:grid;gap:14px}
.stack-sm{display:grid;gap:8px}
.grow{flex:1;min-width:0}

/* ---------- Shell ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-inline:16px}
.topbar-in{display:flex;align-items:center;gap:12px;min-height:56px;max-width:1400px;margin-inline:auto}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:800;font-size:1.1rem;letter-spacing:-.02em}
.brand svg{flex:none}
.co-logos{display:flex;align-items:center;gap:6px;flex:none}
.co-logo{display:block;height:28px;width:auto;background:#fff;border:1px solid var(--line);border-radius:7px;padding:3px 6px;box-sizing:content-box}
.co-logos.big .co-logo{height:40px;padding:5px 9px}
.made-by{display:inline-flex;align-items:center;gap:8px;font-size:.75rem;color:var(--muted,#888);text-decoration:none;justify-self:center}
.made-by img{height:30px;width:auto;background:#fff;border-radius:6px;padding:3px 6px;border:1px solid var(--line)}
@media (max-width:639px){.topbar .brand span{display:none}}
.made-by.lg img{height:42px}
.rail-foot{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.rail-foot .made-by img{height:42px}
/* review fixes 2026-10-03 */
.chip-btn{border:0;cursor:pointer;font:inherit;font-size:.75rem;font-weight:600}
.update-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));z-index:60;display:flex;gap:12px;align-items:center;background:var(--ink);color:var(--bg);padding:10px 12px 10px 16px;border-radius:999px;box-shadow:0 6px 24px rgba(0,0,0,.25);font-size:.85rem;max-width:calc(100vw - 24px)}
.file-list{display:flex;flex-wrap:wrap;gap:6px}
.file-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 10px;font-size:.8rem;max-width:100%}
.file-chip button{border:0;background:var(--surface-2);border-radius:999px;width:28px;height:28px;cursor:pointer;font-size:1rem;line-height:1}
.pick-row{border:0;background:none;text-align:left;cursor:pointer;justify-content:space-between;padding:6px 0;min-height:44px}
.btn.is-busy{opacity:.6;cursor:progress}
.btn.is-busy::after{content:"";width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ap-item{display:flex;align-items:flex-start;gap:6px;padding-left:10px}
.ap-item.sel{background:var(--accent-soft)}
.ap-pick{width:22px;height:22px;margin-top:14px;flex:none}
.ap-pv{align-self:center;margin-right:8px;height:34px;min-width:34px;padding:0;flex:none}.ap-pv svg{width:18px;height:18px}
.pv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.pv-cell{background:var(--surface-2);border-radius:var(--r-sm);padding:8px 10px}
.pv-actions{flex-wrap:wrap;gap:8px;position:sticky;bottom:-1px;background:var(--surface);padding:10px 0 4px;margin-bottom:-4px;border-top:1px solid var(--line);z-index:1}
.pv-lines{display:none}
.pv-line{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
@media (max-width:640px){.pv-table{display:none}.pv-lines{display:block}.pv-actions .btn{flex:1 1 auto}}
.pv-nav{justify-content:center;gap:12px;border-top:1px solid var(--line);padding-top:10px}
.ap-open{border:0;background:none;text-align:left;cursor:pointer;padding:12px 14px 12px 4px;width:100%;color:inherit;font:inherit}
.batch-bar{justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 12px}
.late{color:var(--crit);font-weight:600}
.transfer{color:var(--info, var(--accent));margin-top:3px;white-space:nowrap}
@media (max-width:640px){
  .tbl.cards-sm thead{display:none}
  .tbl.cards-sm tr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 10px;padding:10px 12px;border-bottom:1px solid var(--line)}
  .tbl.cards-sm td{border:0;padding:0;text-align:left}
  .tbl.cards-sm td:first-child{grid-column:1/-1}
  .tbl.cards-sm td[data-label]::before{content:attr(data-label);display:block;font-size:.7rem;color:var(--ink-3);font-weight:600;margin-bottom:2px}
  .tbl.cards-sm td .in.qty{width:100%!important}
}
@media print{.co-logos,.made-by{display:none!important}}
.ctx{min-width:0;display:flex;flex-direction:column;line-height:1.2;border-left:1px solid var(--line);padding-left:12px}
.ctx b{font-weight:600;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx span{font-size:.74rem;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx-btn{background:none;border:0;border-left:1px solid var(--line);text-align:left;cursor:pointer;color:inherit;font:inherit;align-items:flex-start}
.ctx-btn:hover b{text-decoration:underline}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.75rem;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.crit{background:var(--crit-soft);color:var(--crit)}
.chip.info{background:var(--info-soft);color:var(--info)}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:42px;min-width:42px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-size:.85rem;font-weight:600}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn.bell{position:relative;padding:0}.iconbtn.bell svg{width:20px;height:20px}
.iconbtn.bell.off{border-color:#f59e0b;color:#b45309}
.bell-dot{position:absolute;top:6px;right:7px;width:9px;height:9px;border-radius:50%;background:#f59e0b;box-shadow:0 0 0 2px var(--surface)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:.78rem;font-family:var(--f-display)}

.main{padding-inline:16px;padding-block:18px 28px;max-width:1400px;margin-inline:auto}
.promo .main{max-width:760px;padding-bottom:calc(var(--tabbar-h) + 28px + env(safe-area-inset-bottom,0px))}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-in{display:grid;grid-template-columns:repeat(6,1fr);max-width:760px;margin-inline:auto;height:var(--tabbar-h)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.68rem;font-weight:600;color:var(--ink-3);cursor:pointer;position:relative}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.badge{position:absolute;top:8px;left:calc(50% + 6px);background:var(--crit);color:#fff;border-radius:999px;font-size:.62rem;min-width:16px;height:16px;padding:0 4px;display:grid;place-items:center}

.plant-layout{display:grid;grid-template-columns:1fr;gap:18px;align-items:start}
.plant-layout>#main{align-content:start}
.rail{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:.85rem;white-space:nowrap;cursor:pointer;display:flex;align-items:center;gap:8px;color:var(--ink-2)}
.rail button[aria-current="page"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rail .count{background:var(--crit);color:#fff;border-radius:999px;font-size:.68rem;padding:0 6px}
@media (min-width:960px){
  .plant-layout{grid-template-columns:210px minmax(0,1fr);gap:28px}
  .rail{flex-direction:column;position:sticky;top:calc(76px + env(safe-area-inset-top,0px));align-self:start;overflow:visible}
  .rail button{border:0;background:none;border-radius:var(--r-sm);padding:9px 12px;justify-content:flex-start}
  .rail button:hover{background:var(--surface-2)}
  .rail button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
  .rail .count{margin-left:auto}
  .rail .rail-sep{height:1px;background:var(--line);margin:8px 4px}
}
.rail-sep{display:none}

/* ---------- Surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card.flush{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.section-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.grid-2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.list{display:grid}
.list > *{border-top:1px solid var(--line);padding-block:11px}
.list > *:first-child{border-top:0}

/* buttons & fields */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:9px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--crit)}
.btn.ghost{border-color:transparent;background:none}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.lg{min-height:48px;font-size:1rem}
label.f{display:grid;gap:5px;font-size:.8rem;font-weight:600;color:var(--ink-2);min-width:0}
.in,select.in,textarea.in{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:9px 11px;min-height:40px;font-size:.95rem;color:var(--ink);font-weight:400}
textarea.in{min-height:80px;resize:vertical}
.in:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.in.qty{width:84px;text-align:right;font-variant-numeric:tabular-nums}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.stepper button{border:0;background:var(--surface-2);width:44px;height:44px;font-size:1.2rem;cursor:pointer}
.stepper input{border:0;width:56px;text-align:center;height:44px;background:var(--surface);font-variant-numeric:tabular-nums}
.searchbar{display:flex;gap:8px}
.searchbar .in{min-height:48px;font-size:1rem}

/* product line */
.prod{display:flex;align-items:center;gap:11px;min-width:0}
.sw{width:30px;height:30px;border-radius:5px;flex:none;border:1px solid rgba(0,0,0,.12);position:relative;overflow:hidden}
.sw::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.28),transparent 55%)}
.sw.eb{height:12px;align-self:center;border-radius:3px}
.prod .nm{font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.prod .meta{font-size:.76rem;color:var(--ink-3)}

/* tables */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tbl{width:100%;border-collapse:collapse;font-size:.85rem}
.tbl th{text-align:left;font-weight:700;font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right;font-variant-numeric:tabular-nums}
.tbl tbody tr:hover td{background:color-mix(in srgb,var(--surface-2) 55%,transparent)}
.tbl tr.sel td{background:var(--accent-soft)}

/* KPI */
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .v{font-family:var(--f-display);font-size:1.55rem;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:4px}
.kpi .d{font-size:.78rem;margin-top:2px}
.up{color:var(--good)} .down{color:var(--crit)}
.cmp-bar{height:4px;background:var(--line);border-radius:2px;margin-top:4px;overflow:hidden}.cmp-bar i{display:block;height:100%;background:var(--series-1)}
.cmp-mx th .cmp-col{max-width:110px;white-space:normal;line-height:1.2;font-size:12px}.cmp-mx td.num{min-width:84px}.cmp-mx tr.total td{border-top:2px solid var(--line)}

.chart-box{position:relative;height:260px}
.chart-box.tall{height:300px}

/* stepper of approvals */
.chain{display:flex;gap:0;align-items:flex-start;overflow-x:auto;padding-block:4px}
.chain .st{flex:1 0 74px;display:grid;justify-items:center;text-align:center;gap:5px;position:relative;font-size:.68rem;color:var(--ink-3);font-weight:600;line-height:1.2;padding-inline:2px}
.chain .st::before{content:"";position:absolute;top:8px;left:-50%;right:50%;height:2px;background:var(--line);z-index:0}
.chain .st:first-child::before{display:none}
.chain .pin{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);background:var(--surface);z-index:1;display:grid;place-items:center}
.chain .st.done{color:var(--ink-2)}
.chain .st.done .pin{background:var(--accent);border-color:var(--accent)}
.chain .st.done::before,.chain .st.now::before{background:var(--accent)}
.chain .st.now{color:var(--ink)}
.chain .st.now .pin{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.chain .st.stop .pin{background:var(--crit);border-color:var(--crit)}

/* chat */
.chat{display:flex;flex-direction:column;gap:8px;max-height:56vh;overflow-y:auto;padding:4px 2px}
.bubble{max-width:82%;padding:9px 12px;border-radius:14px;background:var(--surface-2);overflow-wrap:anywhere}
.bubble.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.bubble.them{align-self:flex-start;border-bottom-left-radius:4px}
.bubble .who{font-size:.7rem;font-weight:700;opacity:.75;margin-bottom:2px}
.bubble .t{font-size:.66rem;opacity:.7;margin-top:3px;text-align:right}
.announce{border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:var(--r-sm);padding:10px 12px;background:var(--surface)}

/* quick actions */
.qa{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:560px){.qa{grid-template-columns:repeat(4,1fr)}}
.qa button{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px 12px;text-align:left;cursor:pointer;display:grid;gap:8px;min-height:92px}
.qa button:hover{border-color:var(--accent)}
.qa svg{width:24px;height:24px;color:var(--accent)}
.qa b{font-family:var(--f-display);font-size:.95rem}
.qa span{font-size:.74rem;color:var(--ink-3)}

/* login */
.login{max-width:880px;margin-inline:auto;padding-block:28px 40px;display:grid;gap:22px}
.login-hero{display:grid;gap:10px}
.login-hero h1{font-size:clamp(1.8rem,4vw,2.6rem);line-height:1.05}
.users{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.user{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:13px 14px;display:flex;gap:12px;align-items:center;cursor:pointer;text-align:left}
.user:hover{border-color:var(--accent)}
.user .avatar{width:38px;height:38px;flex:none}
.group-label{margin-top:6px}

/* misc */
.empty{padding:22px 12px;text-align:center;color:var(--ink-3);font-size:.9rem}
.toast-wrap{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabbar-h) + 18px + env(safe-area-inset-bottom,0px));z-index:50;display:grid;gap:8px;width:min(92vw,420px);pointer-events:none}
.toast{background:var(--ink);color:var(--bg);border-radius:var(--r-sm);padding:11px 14px;font-weight:600;font-size:.88rem;box-shadow:var(--shadow);animation:pop .2s ease-out}
.toast.err{background:var(--crit);color:#fff}

   SERVER holds what the server sent; S is SERVER plus whatever is still waiting on this phone (replayed from the sync list).
   A full load runs at sign-in, on "Refresh data" and every 30 minutes when the app is in use; in between only what changed
   is fetched (new sales, stock that moved, requests that changed), so a sale doesn't re-download the whole network. */

function loadLib(name) {
  const lib = LIBS[name];

    let err = null;
    for (const u of lib.urls) {

/* how much to ask for: back to twice the shelf minimum (the Plant sets minimums to each item's reorder point), minus what's already coming, in whole packs */
function suggestQty(dpId, p) {
  const s = idx.stock(dpId, p.id), pack = p.pack_qty || 1, pq = pipelineQty(dpId, p.id);
  const need = s ? s.min_display * 2 - s.on_hand - pq.transit - pq.pending : 0;
  return Math.max(pack, Math.ceil(Math.max(0, need) / pack) * pack);
}

function groupSellouts(rows) {
  const g = new Map(); rows.forEach(r => { const k = r.depot_id + "|" + r.period_start + "|" + r.period_end; const x = g.get(k) || { depot_id: r.depot_id, period_start: r.period_start, period_end: r.period_end, lines: 0, qty: 0, amount: 0, source: r.source, created_at: r.created_at };

  after() {
    const f = UI.f, A = aggregate(f), proj = weeklyProjection(A.money), css = getComputedStyle(document.documentElement);
    const c = n => css.getPropertyValue(n).trim();
    const base = { responsive: true, maintainAspectRatio: false, animation: false, interaction: { mode: "index", intersect: false },
      plugins: { legend: { display: false }, tooltip: { backgroundColor: c("--ink"), titleColor: c("--bg"), bodyColor: c("--bg"), padding: 10, cornerRadius: 6 } },
      scales: { x: { grid: { display: false }, ticks: { color: c("--ink-3"), maxRotation: 0, autoSkipPadding: 14, font: { size: 11 } }, border: { color: c("--line") } },
        y: { grid: { color: c("--grid") }, ticks: { color: c("--ink-3"), font: { size: 11 } }, border: { display: false }, beginAtZero: true } } };
    const s1 = c("--series-1"), band = c("--series-band");
    const W = proj.W, n = W + 8;
    const actual = proj.wk.concat(Array(8).fill(null));
    const fc = Array(W - 1).fill(null).concat([proj.wk[W - 1]], proj.fc);
    const hi = Array(W - 1).fill(null).concat([proj.wk[W - 1]], proj.fc.map((v, i) => v + 1.28 * proj.rmse * Math.sqrt(i + 1)));
    const lo = Array(W - 1).fill(null).concat([proj.wk[W - 1]], proj.fc.map((v, i) => Math.max(0, v - 1.28 * proj.rmse * Math.sqrt(i + 1))));
    const money = v => pesoK(v);
    charts.push(new Chart($("#ch-proj"), { type: "line", data: { labels: proj.labels, datasets: [
      { label: "High", data: hi, borderWidth: 0, pointRadius: 0, fill: "+1", backgroundColor: band },
      { label: "Low", data: lo, borderWidth: 0, pointRadius: 0, fill: false },
      { label: "Actual", data: actual, borderColor: s1, borderWidth: 2, pointRadius: 0, pointHoverRadius: 5, tension: .25 },
      { label: "Projection", data: fc, borderColor: s1, borderDash: [5, 4], borderWidth: 2, pointRadius: 0, pointHoverRadius: 5, tension: .25 }] },
      options: { ...base, plugins: { ...base.plugins, tooltip: { ...base.plugins.tooltip, filter: i => i.raw != null && (i.dataset.label === "Actual" || i.dataset.label === "Projection") && !(i.dataset.label === "Projection" && i.dataIndex === W - 1), callbacks: { label: i => " " + i.dataset.label + ": " + peso(i.raw), title: i => "Week ending " + i[0].label } } },
        scales: { ...base.scales, y: { ...base.scales.y, ticks: { ...base.scales.y.ticks, callback: money } } } } }));
    const invLabels = [], invData = [];
    for (let i = 89; i >= 0; i--) { invLabels.push(dshort(today0() - i * DAY)); invData.push(Math.round(A.inv[i])); }
    charts.push(new Chart($("#ch-inv"), { type: "line", data: { labels: invLabels, datasets: [{ label: "On hand", data: invData, borderColor: s1, borderWidth: 2, pointRadius: 0, pointHoverRadius: 5, fill: true, backgroundColor: band, tension: .2 }] },
      options: { ...base, plugins: { ...base.plugins, tooltip: { ...base.plugins.tooltip, callbacks: { label: i => " " + fmt(i.raw) + " units" } } } } }));
    const acct = Object.entries(A.byAcct).sort((a, b) => b[1] - a[1]);
    charts.push(new Chart($("#ch-acct"), { type: "bar", data: { labels: acct.map(a => idx.account(a[0]).name), datasets: [{ data: acct.map(a => Math.round(a[1])), backgroundColor: s1, borderRadius: 4, maxBarThickness: 28 }] },
      options: { ...base, indexAxis: "y", plugins: { ...base.plugins, tooltip: { ...base.plugins.tooltip, callbacks: { label: i => " " + peso(i.raw) } } }, scales: { x: { ...base.scales.y, ticks: { ...base.scales.y.ticks, callback: money } }, y: { ...base.scales.x, grid: { display: false } } } } }));
    const top = Object.entries(A.byProd).sort((a, b) => b[1].u - a[1].u).slice(0, 10);
    charts.push(new Chart($("#ch-top"), { type: "bar", data: { labels: top.map(t => idx.product(t[0]).sku), datasets: [{ data: top.map(t => t[1].u), backgroundColor: s1, borderRadius: 4, maxBarThickness: 22 }] },
      options: { ...base, indexAxis: "y", plugins: { ...base.plugins, tooltip: { ...base.plugins.tooltip, callbacks: { title: i => idx.product(top[i[0].dataIndex][0]).name, label: i => " " + fmt(i.raw) + " units · " + peso(top[i.dataIndex][1].m) } } }, scales: { x: base.scales.y, y: { ...base.scales.x, grid: { display: false } } } } }));
  }},

      ${lines.map(l => { const p = prod(l), q = l.qty_approved ?? l.qty_requested, oth = others.reduce((s, o) => s + Number((l.supply || {})[o.id] || 0), 0);

/* show COF photos inline on the request page (signed URL live, kept blob in the demo) */
async function loadDocImages() {

/* when the request reached the step it's at now */
function waitingSince(r) {
  const ev = S.request_events.filter(e => e.request_id === r.id && e.to_status === r.status).sort((a, b) => b.created_at.localeCompare(a.created_at))[0];

/* request units and value (at the depot's account prices) — one helper for the list, the card and the reports */

/* approvals that need nothing but a yes from this person (no Odoo ticket to type, no quantities to change) can go in one batch */
function canBatch(r) {

/* tiny markdown for AI output */
function md(t) {

  lines.forEach(l => {
    if (/^\s*[-*•]\s+/.test(l)) { if (!inList) { out += "<ul>"; inList = true; } out += "<li>" + inline(l.replace(/^\s*[-*•]\s+/, "")) + "</li>"; return; }
    if (inList) { out += "</ul>"; inList = false; }

function demoAnalysis(P) {

  t += `${P.reorder_now.length} item-depot combinations are at or below their reorder point. Suggested total: **${fmt(totalSug)} units**.\n`;

  if (P.top_missed_sales.length) { t += `## Missed sales\n`; P.top_missed_sales.slice(0, 4).forEach(x => t += `- **${x.sku}** at ${x.depot}: ${x.missed_sales_logged} units asked for while out of stock. Demand is higher than sales show; the suggestion already includes these.\n`); }

/* all stock-affecting movements (incl. sales) for depots × optional item, newest first, with balance after each line */
function movementRows({ depots, product, from, to, kinds }) {
  const ds = new Set(depots), f = from ? new Date(from).getTime() : 0, t = to ? new Date(to).getTime() : Infinity;
  const rows = [];
  S.movements.forEach(m => { if (!ds.has(m.depot_id) || (product && m.product_id !== product) || m.affects_stock === false) return;
    rows.push({ at: m.created_at, depot_id: m.depot_id, product_id: m.product_id, qty: m.qty, kind: m.kind, ref: m.ref_text || "", note: m.note || "", by: m.created_by, id: m.id }); });
  const saleById = new Map(S.sales.filter(s => ds.has(s.depot_id) && s.affects_stock !== false).map(s => [s.id, s]));
  S.sale_lines.forEach(l => { const s = saleById.get(l.sale_id); if (!s || (product && l.product_id !== product)) return;
    rows.push({ at: s.sold_at, depot_id: s.depot_id, product_id: l.product_id, qty: -l.qty, kind: "sale", ref: s.receipt_no || "", note: "", by: s.created_by, id: l.id, price: l.unit_price }); });

}

const REPORT_TYPES = {

  movements: { label: "Stock movements", groups: ["kind", "depot", "item", "month"], measures: ["in", "out", "net"] },
  requests: { label: "Replenishment requests", groups: ["status", "depot", "month", "account"], measures: ["count", "units", "value", "days"] },
  missed: { label: "Missed sales", groups: ["item", "depot", "month", "category"], measures: ["units", "count"] },
  targets: { label: "Target vs actual", groups: ["depot", "month", "account"], measures: ["amount"] },
  competitors: { label: "Competitor prices", groups: ["brand", "category", "depot"], measures: ["count", "gap"] }

const GROUP_LABEL = { month: "Month", week: "Week", day: "Day", account: "Account", depot: "Depot", region: "Region", item: "Item", category: "Type", promodiser: "Promodiser", status: "Status", kind: "Movement", brand: "Brand" };

const PERIODS = { this_month: "This month", last_month: "Last month", last_3m: "Last 3 months", last_6m: "Last 6 months", last_12m: "Last 12 months", ytd: "Year to date", custom: "Custom dates" };
function periodRange(cfg) {
  const n = new Date(), y = n.getFullYear(), m = n.getMonth();
  const r = { this_month: [new Date(y, m, 1), n], last_month: [new Date(y, m - 1, 1), new Date(y, m, 0)], last_3m: [new Date(y, m - 2, 1), n], last_6m: [new Date(y, m - 5, 1), n],
    last_12m: [new Date(y, m - 11, 1), n], ytd: [new Date(y, 0, 1), n] }[cfg.period];

const weekKey = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return isoDate(d); };
function groupKey(g, { depot_id, product_id, at, user, status, kind, brand, category, asked }) {

    case "week": { const k = weekKey(at); return [k, "Week of " + dshort(k)]; }
    case "day": return [isoDate(at), dshort(at)];
    case "account": return [d ? d.account_id : "?", d ? idx.account(d.account_id).name : "?"];
    case "depot": return [depot_id, d ? d.name : "?"];
    case "region": return [d ? d.region || "—" : "—", d ? d.region || "—" : "—"];

function reportData(cfg) {

      add({ depot_id: r.depot_id, product_id: r.product_id, at: r.at, kind: r.kind }, { in: r.qty > 0 ? r.qty : 0, out: r.qty < 0 ? -r.qty : 0, net: r.qty }));

      const ls = S.request_lines.filter(l => l.request_id === r.id), units = ls.reduce((s, l) => s + (l.qty_approved ?? l.qty_requested), 0);

function aiRecInput(x, all) {
  const R = Number(S.settings.review_days) || 14;
  const nearby = all.filter(y => y.p.id === x.p.id && y.dp.id !== x.dp.id && y.dp.account_id === x.dp.account_id && (y.dp.region || "") === (x.dp.region || "") && y.oh > y.target)
    .map(y => ({ depot: y.dp.name, depot_id: y.dp.id, excess: Math.floor(y.oh - y.target) })).filter(y => y.excess > 0);
  return { key: x.dp.id + "|" + x.p.id, sku: x.p.sku, item: x.p.name, category: x.p.category, depot: x.dp.name, account: idx.account(x.dp.account_id).name, region: x.dp.region,
    class: x.cls, on_hand: x.oh, in_pipeline: x.transit + x.pending, avg_daily_90d: +x.dbar.toFixed(2), avg_daily_30d: +x.d30.toFixed(2), sd_daily: +x.sdd.toFixed(2),
    lead_time_days: +x.L.toFixed(1), lead_time_sd: +x.sL.toFixed(1), review_days: R, safety_stock: Math.round(x.ss), reorder_point: Math.round(x.rop),
    formula_qty: x.suggestedRaw, formula_qty_after_space: x.suggested, pack_qty: x.p.pack_qty || 1, missed_sales_logged: x.lostQty,
    space: x.cap != null ? { category_capacity: x.cap, category_used_incl_pipeline: x.capUsed, room_left: x.capRoom } : null, nearby_overstock: nearby };
}
function demoAiRec(i) {
  const pack = i.pack_qty || 1, roundUp = q => Math.max(0, Math.ceil(q / pack) * pack), why = [];
  let q = i.formula_qty;
  const tr = i.avg_daily_90d > 0 ? i.avg_daily_30d / i.avg_daily_90d - 1 : 0;
  if (tr > 0.15 && q > 0) { q = roundUp(q * (1 + Math.min(tr, 0.5) * 0.6)); why.push(`sales up ${fmt(tr * 100)}% in the last 30 days`); }
  else if (tr < -0.2) { q = roundUp(q * (1 + Math.max(tr, -0.6) * 0.6)); why.push(`sales slowing (${fmt(tr * 100)}% vs 90-day average)`); }
  if (i.missed_sales_logged > 0) why.push(`${fmt(i.missed_sales_logged)} missed sales logged, already counted as demand`);
  const near = (i.nearby_overstock || []).sort((a, b) => b.excess - a.excess)[0];
  if (near && q > 0) { const t = Math.min(q, Math.floor(near.excess / pack) * pack); if (t > 0) { q -= t; why.push(`transfer ${fmt(t)} from ${near.depot} first (overstocked)`); } }
  if (i.space && q > i.space.room_left) { q = Math.floor(i.space.room_left / pack) * pack; why.push(`only room for ${fmt(i.space.room_left)} more ${i.category.toLowerCase()} on the shelf`); }
  else if (i.space && i.formula_qty > i.formula_qty_after_space) why.push("formula was cut for shelf space");
  if (i.avg_daily_90d > 0 && i.sd_daily / i.avg_daily_90d > 1.4) why.push("sales are irregular, keep the safety stock");
  if (!why.length) why.push(q > 0 ? "agree with the formula" : "enough stock and pipeline for now");
  return { key: i.key, qty: Math.max(0, q), reason: why.join("; ").replace(/^./, c => c.toUpperCase()) + "." };
}
async function runAiRecs() {
  if (isPromo() || UI.aiRecBusy) return;
  const ds = new Set(scopeDepots(UI.f).map(d => d.id)), all = planRows();
  const pick = all.filter(x => ds.has(x.dp.id) && (["out", "order", "watch"].includes(x.status) || x.suggestedRaw > 0)).sort((a, b) => a.cover - b.cover).slice(0, 40);
  if (!pick.length) return toast("Nothing in this view needs replenishing");
  UI.aiRecBusy = true; rerender();
  try {
    const inputs = pick.map(x => aiRecInput(x, all));
    let recs, model = "rules (demo)";
    if (MODE === "live") { const r = await fn(liveConfig().aiFunction, { mode: "replenish", rows: inputs, settings: S.settings }); recs = r.recs; model = r.model || "claude"; }
    else { await new Promise(r => setTimeout(r, 400)); recs = inputs.map(demoAiRec); }
    const byKey = new Map(inputs.map(i => [i.key, i]));
    // never above the shelf space left, always a whole pack
    const clamp = (i, q) => { const pack = i.pack_qty || 1; q = Math.max(0, Math.round(Number(q) || 0)); if (i.space) return Math.floor(Math.min(q, i.space.room_left) / pack) * pack; return Math.ceil(q / pack) * pack; };
    await API.run("aiRecs", { rows: recs.filter(r => byKey.has(r.key)).map(r => { const [depot_id, product_id] = r.key.split("|"), i = byKey.get(r.key); return { depot_id, product_id, base_qty: i.formula_qty_after_space, ai_qty: clamp(i, r.qty), reason: String(r.reason || "").slice(0, 400), model }; }) });
    UI.planF = "ai"; toast("AI advice added for " + recs.length + " items");
  } catch (e) { if (!e.cancelled) toast("AI advice failed: " + e.message, true); }
  UI.aiRecBusy = false; rerender();
}

/* apply an import (demo: local; live: batched inserts) */

  const salesGroups = () => { const g = new Map(); rows.forEach(r => { const k = r.depot_id + "|" + r.date + "|" + (r.receipt || ""); if (!g.has(k)) g.set(k, { id: uuid(), depot_id: r.depot_id, sold_at: r.date + "T12:00:00+08:00", receipt_no: r.receipt || "Tracker " + r.date, lines: [] }); g.get(k).lines.push(r); }); return Array.from(g.values()); };
  if (MODE === "live") {

    } else if (kind === "retailer_sales") {

    else if (kind === "stock_checks") await ins("ss_stock_checks", rows.map(r => ({ depot_id: r.depot_id, product_id: r.product_id, kind: r.kind, reason: r.reason, as_of: r.as_of, expected: r.expected, counted: r.counted, import_id: imp.id })));

/* one tap = one save: the button is disabled while it works, a second tap does nothing */
async function once(key, fnc) {

  /* add an item with the suggested quantity (change it in the list); warns when it's already requested or on its way */
  reqPick(pid) {
    const p = idx.product(pid), dp = myDepot(), q = suggestQty(dp.id, p), pq = pipelineQty(dp.id, pid);
    const l = UI.reqDraft.find(x => x.product_id === pid); if (l) return toast(p.sku + " is already in this request. Change its quantity below.");
    UI.reqDraft.push({ product_id: pid, qty_requested: q }); UI.rqQ = ""; saveUI(); rerender();
    toast(pq.transit + pq.pending ? `Added ${p.sku}. Note: ${fmt(pq.transit + pq.pending)} is already requested or on its way.` : "Added " + p.sku + " × " + fmt(q));

  reqDel(i) { UI.reqDraft.splice(i, 1); saveUI(); rerender(); },
  requestLow() {
    const dp = myDepot(); let n = 0, skipped = 0;
    myProducts().forEach(p => { const s = idx.stock(dp.id, p.id); if (!s || !(s.min_display > 0) || s.on_hand > s.min_display || UI.reqDraft.find(x => x.product_id === p.id)) return;
      const pq = pipelineQty(dp.id, p.id); if (s.on_hand + pq.transit + pq.pending > s.min_display) { skipped++; return; }      // enough already coming
      UI.reqDraft.push({ product_id: p.id, qty_requested: suggestQty(dp.id, p) }); n++; });
    saveUI(); go("request"); toast(n ? `${n} low item${n > 1 ? "s" : ""} added. Adjust quantities, then send.` + (skipped ? ` ${skipped} skipped: enough is already on its way.` : "") : "Nothing to add: what's low is already requested.");

  async act(id, action) {
    const r = S.requests.find(x => x.id === id), note = val("ap-note").trim() || null, odoo = val("ap-odoo").trim();
    let lines = null;
    if (action === "approve" || action === "dispatch") {
      // approved quantity, and how much of it comes from another plant (split supply)
      let bad = null;
      const ins = S.request_lines.filter(l => l.request_id === id).map(l => {
        const el = document.getElementById("apq-" + l.id), out = { id: l.id };
        const total = el ? Number(el.value) : (l.qty_approved ?? l.qty_requested);
        if (el && action === "approve") out.qty_approved = total;
        const parts = (S.plants || []).filter(p => p.id !== r.plant_id).map(p => [p.id, document.getElementById("aps-" + l.id + "-" + p.id)]).filter(x => x[1]);
        if (parts.length) {
          const sup = {}; let other = 0;
          parts.forEach(([k, inp]) => { const v = Number(inp.value || 0); if (v < 0 || isNaN(v)) bad = "Quantities can't be negative"; if (v > 0) { sup[k] = v; other += v; } });
          if (other > total) bad = "Split supply is more than the approved quantity for " + ((idx.product(l.product_id) || {}).sku || "an item");
          out.supply = other > 0 ? Object.assign({ [r.plant_id]: total - other }, sup) : null;
        }
        return Object.keys(out).length > 1 ? out : null;
      }).filter(Boolean);
      if (bad) return toast(bad, true);

    }
    if (action === "reject" && !note) return toast("Add a remark explaining the rejection", true);

      // straight on to the next request waiting for this person (oldest first)
      if (!isPromo()) { const next = myQueue().filter(x => x.id !== id).sort((a, b) => waitingSince(a) - waitingSince(b))[0]; UI.apSel = next ? next.id : id; }

/* =====================================================================
   STOCK TO VERIFY — a stock figure whose history doesn't add up is used, but marked until someone confirms it.
   Marks come from Import data › "Stock to verify" (the files' own inconsistencies) or are added here.
   The plant closes them: ask the promodiser to recount, confirm, correct (a stock adjustment, applied when approved), or dismiss.
   A promodiser's count that includes the item records the counted figure on the mark; the plant then accepts or corrects it.
   ===================================================================== */
const CHECK_CLOSED = ["validated", "adjusted", "dismissed"];
const CHECK_ACTIVE = ["open", "recount", "counted"];
const stockChecks = () => S.stock_checks || (S.stock_checks = []);
const CHECK_KIND = {
  went_up: "Went up, no delivery", went_down: "Went down, no sale", versions: "File copies disagree", pullout: "Pull-out to confirm",
  identity: "Confirm the item", stale: "Not counted lately", sales_value: "Sales report differs", sheet_math: "Sheet doesn't add up", other: "Other"
};
const CHECK_STATUS = { open: ["Needs checking", "warn"], recount: ["Recount asked", "info"], counted: ["Recounted — review", "info"],
  validated: ["Confirmed", "good"], adjusted: ["Corrected", "good"], dismissed: ["Dismissed", ""] };
const canCloseChecks = () => !viewOnly() && hasRole("admin", "ppic", "scm", "plant_mgr");
/* active marks on one stock line, or on the whole depot (product_id null) */
function activeChecks(depotId, productId) {
  return stockChecks().filter(c => c.depot_id === depotId && CHECK_ACTIVE.includes(c.status) && (productId === undefined || c.product_id === productId || (productId !== null && !c.product_id)));
}
/* the small mark shown next to a stock figure */
function checkMark(depotId, productId, opts = {}) {
  const line = stockChecks().filter(c => c.depot_id === depotId && c.product_id === productId && CHECK_ACTIVE.includes(c.status));
  // a whole-depot mark puts every figure in doubt — except a sales-report difference, which questions sales, not each item's stock
  const whole = stockChecks().some(c => c.depot_id === depotId && !c.product_id && CHECK_ACTIVE.includes(c.status) && c.kind !== "sales_value");
  if (!line.length && !whole) return "";
  const why = line.map(c => c.reason).concat(whole ? ["Whole depot: not confirmed"] : []).join(" • ");
  return `<span class="chip warn chk-mark" title="${esc(why)}">${opts.text === false ? "!" : line.some(c => c.status === "recount") ? "Recount" : "Check"}</span>`;
}

/* =====================================================================
   WEEKLY STOCK COUNT and STOCK ADJUSTMENTS (supabase/weekly_count.sql)
   ---------------------------------------------------------------------
   Every branch counts its stock each week and submits it by the deadline
   (Friday 6:00 PM unless Admin changes it). A count records what was on
   the shelf and the system figure at that moment; it does NOT change stock.
   PPIC reviews each count. Where they differ, PPIC proposes an adjustment
   (take the count, keep the system figure, or another figure) with a reason.
   The adjustment goes through the approval chain set by Admin (default:
   Supply Chain; can add Plant Manager, S&M Director, Managing Director).
   Stock changes only on the final approval.
   ===================================================================== */
const ADJ_ROLES = ["scm", "plant_mgr", "smd", "md"];
const DAY_NAMES = ["", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
function adjustments() { return S.adjustments || (S.adjustments = []); }
function adjustChain() { const c = (S.settings && S.settings.adjust_chain) || ["scm"]; return ADJ_ROLES.filter(r => c.includes(r)).sort((a, b) => c.indexOf(a) - c.indexOf(b)); }
const weeklyCfg = () => Object.assign({ day: 5, due: "18:00", remind: "08:00" }, (S.settings && S.settings.weekly_count) || {});
/* weeks run Monday to Sunday (Philippine time); a week is named by its Friday, like the database */
function weekMonday(t) { const d = new Date(new Date(t).getTime() + 8 * 3600e3); const off = (d.getUTCDay() + 6) % 7; d.setUTCDate(d.getUTCDate() - off); return d.toISOString().slice(0, 10); }
function weekFriday(t) { const m = new Date(weekMonday(t) + "T00:00:00Z"); m.setUTCDate(m.getUTCDate() + 4); return m.toISOString().slice(0, 10); }
const addDaysIso = (iso, n) => { const d = new Date(iso + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
/* the deadline of the week whose Friday is wk */
function weekDue(wk) { const c = weeklyCfg(), day = addDaysIso(addDaysIso(wk, -4), (Number(c.day) || 5) - 1); return new Date(day + "T" + (c.due || "18:00") + ":00+08:00"); }
const time12 = hm => { const [h, m] = String(hm || "18:00").split(":").map(Number); return ((h % 12) || 12) + ":" + String(m || 0).padStart(2, "0") + (h < 12 ? " AM" : " PM"); };
const dueText = wk => { const d = weekDue(wk); return d.toLocaleDateString("en-PH", { weekday: "short", month: "short", day: "numeric", timeZone: "Asia/Manila" }) + ", " + d.toLocaleTimeString("en-PH", { hour: "numeric", minute: "2-digit", timeZone: "Asia/Manila" }); };
/* the items a branch counts every week: what it carries (has a stock line), else every item of its company */
function weeklyItems(depotId) {
  const d = idx.depot(depotId); if (!d) return [];
  const carried = new Set(S.stock.filter(s => s.depot_id === depotId).map(s => s.product_id));
  const co = S.products.filter(p => p.company_id === d.company_id && p.active !== false);
  const mine = co.filter(p => carried.has(p.id));
  return (mine.length ? mine : co).sort((a, b) => (a.sku || "").localeCompare(b.sku || ""));
}
const weeklyCountOf = (depotId, wk) => S.counts.filter(c => c.depot_id === depotId && c.kind === "weekly" && c.week_of === wk).sort((a, b) => String(b.created_at).localeCompare(String(a.created_at)))[0] || null;
const countLines = id => S.count_lines.filter(l => l.count_id === id);
const promosOf = depotId => S.users.filter(u => u.role === "promodiser" && u.status === "active" && (u.depot_id === depotId || (u.depot_ids || []).includes(depotId)));
/* system figure for an item at a moment: stock now, less what moved after */
function stockAt(depotId, productId, at) {
  const t = new Date(at).getTime(); let later = 0;
  S.movements.forEach(m => { if (m.depot_id === depotId && m.product_id === productId && m.affects_stock !== false && new Date(m.created_at).getTime() > t) later += m.qty; });
  const ids = new Set(S.sales.filter(s => s.depot_id === depotId && s.affects_stock !== false && new Date(s.sold_at).getTime() > t).map(s => s.id));
  S.sale_lines.forEach(l => { if (ids.has(l.sale_id) && l.product_id === productId) later -= l.qty; });
  return onHand(depotId, productId) - later;
}
/* final approval (demo / this phone): stock follows, as the database does */
function adjApply(a) {
  const now = new Date().toISOString(), cnt = a.count_id && S.counts.find(x => x.id === a.count_id), at = cnt ? cnt.created_at : now;
  a._lines.forEach(l => {
    const sys = stockAt(a.depot_id, l.product_id, at), d = l.new_qty - sys;
    if (d) Engine.move(a.depot_id, l.product_id, d, "count_adj", a.id, at, { ref_text: a.adj_no, note: l.reason });
    l.applied_delta = d;
    const c = l.check_id && stockChecks().find(x => x.id === l.check_id);
    if (c && !CHECK_CLOSED.includes(c.status)) Object.assign(c, { status: "adjusted", counted: l.new_qty, resolution: "Adjusted to " + fmt(l.new_qty) + " (" + a.adj_no + ")", resolved_by: ME.id, resolved_at: now, updated_at: now });
  });
  Object.assign(a, { status: "approved", applied_at: now, decided_by: ME.id, decided_at: now, updated_at: now });
  a._events.push({ id: uuid(), step: a.step, action: "applied", note: "Stock changed", by_user: ME.id, at: now });
  if (cnt) cnt.status = "applied";
}
const ADJ_STATUS = { pending: ["Waiting", "warn"], approved: ["Approved — stock updated", "good"], rejected: ["Rejected", "crit"], cancelled: ["Cancelled", ""] };
const COUNT_STATUS = { submitted: ["To review", "warn"], reviewed: ["Reviewed", "info"], applied: ["Adjusted", "good"] };
const canReviewCounts = () => !viewOnly() && hasRole("admin", "ppic");
const canActAdj = a => !viewOnly() && a.status === "pending" && hasRole(a.chain[a.step], "admin") && (a.created_by !== ME.id || hasRole("admin")) && inMyPlant(a.depot_id);
const adjWaiting = a => a.status === "pending" ? "Waiting for " + (ROLES[a.chain[a.step]] || a.chain[a.step] || "approval") : (ADJ_STATUS[a.status] || [a.status])[0];
/* differences in one count: [{line, product, diff, value}] */
function countDiffs(c) {
  return countLines(c.id).map(l => { const p = idx.product(l.product_id) || { sku: "?", name: "Unknown item", uom: "" }, diff = l.counted_qty - (l.system_qty ?? 0);
    return { l, p, diff, value: diff * (p.srp || 0) }; }).filter(x => x.diff);
}
const countsToReview = () => S.counts.filter(c => c.status === "submitted" && c.kind !== "opening" && inMyPlant(c.depot_id));
/* the number on the rail: counts for PPIC to review, adjustments waiting for me */
function myWeeklyCount() {
  return (canReviewCounts() ? countsToReview().length : 0) + adjustments().filter(canActAdj).length;
}
/* promodiser: the weekly count card on Home */
function weeklyHomeCard(dp) {
  if (!can("count")) return "";
  const wk = weekFriday(Date.now()), c = weeklyCountOf(dp.id, wk), due = weekDue(wk), now = Date.now();
  if (c) return `<div class="notice row between"><span>✅ Weekly count sent ${dtime(c.created_at)}${new Date(c.created_at) > due ? " (late)" : ""}. PPIC checks it.</span></div>`;
  const late = now > due, today = isoDate(now) === isoDate(due);
  return `<div class="card stack-sm" style="border-color:var(--${late ? "crit" : today ? "warn" : "line"})"><div class="card-h" style="margin:0"><h2>Weekly stock count</h2><span class="chip ${late ? "crit" : today ? "warn" : "info"}">${late ? "Late" : today ? "Due today" : "Due " + DAY_NAMES[Number(weeklyCfg().day) || 5]}</span></div>
    <p class="small muted">${late ? "The deadline was " + esc(dueText(wk)) + ". Count every item and submit it now." : "Count every item on the shelf and in the stockroom and submit by <b>" + esc(dueText(wk)) + "</b>."} Your stock doesn't change until PPIC checks the count and it is approved.</p>
    <button class="btn primary block" onclick="UI.countMode='weekly';App.sub('stock','count');App.go('stock')">${ICON.count}<span>Start weekly count</span></button></div>`;
}

/* ---------- what sells where, and what customers asked for that we couldn't sell ---------- */
const LOST_REASON = { out_of_stock: ["Out of stock here", "warn"], not_carried: ["Not carried here", "info"], not_in_range: ["We don't sell it", "crit"] };
/* at the time it's logged: carried here (a stock line exists) → out of stock; our item not stocked here → not carried; no item → not in our range */
function lostReason(depotId, pid) { if (!pid) return "not_in_range"; return S.stock.some(s => s.depot_id === depotId && s.product_id === pid) ? "out_of_stock" : "not_carried"; }

const carries = (depotId, pid) => S.stock.some(s => s.depot_id === depotId && s.product_id === pid);

function lostFacts(data, ds) {
  const f0 = new Date(data.from + "T00:00:00").getTime(), t0 = new Date(data.to + "T23:59:59").getTime();
  return (S.lost_sales || []).filter(l => ds.has(l.depot_id)).filter(l => { const v = new Date(l.created_at).getTime(); return v >= f0 && v <= t0; });
}
/* every item: where it sells, where it's carried, where it was asked for */
function bestData(data) {
  const key = "best" + data.from + data.to + data.rows.map(r => r.d.id).join(); if (CACHE[key]) return CACHE[key];
  const dep = data.rows.map(r => r.d), ds = new Set(dep.map(d => d.id)), P = new Map();
  const get = pid => { if (!P.has(pid)) P.set(pid, { pid, p: idx.product(pid), amount: 0, units: 0, at: {}, asked: 0, askedAt: {} }); return P.get(pid); };
  data.rows.forEach(r => Object.entries(r.byProd).forEach(([pid, v]) => { const x = get(pid); x.amount += v.amount; x.units += v.units; x.at[r.d.id] = v; }));
  lostFacts(data, ds).forEach(l => { if (!l.product_id) return; const x = get(l.product_id); x.asked += l.qty; x.askedAt[l.depot_id] = (x.askedAt[l.depot_id] || 0) + l.qty; });
  const items = Array.from(P.values()).filter(x => x.p).map(x => {
    // only depots of the item's own company can carry it
    const mine = dep.filter(d => !x.p.company_id || d.company_id === x.p.company_id), selling = Object.keys(x.at), notCarried = mine.filter(d => !carries(d.id, x.pid) && !x.at[d.id]), idle = mine.filter(d => onShelf(d.id, x.pid) && !x.at[d.id]);
    const best = selling.sort((a, b) => x.at[b].amount - x.at[a].amount)[0];
    return { ...x, selling: selling.length, of: mine.length, best: best ? idx.depot(best) : null, perSelling: selling.length ? x.amount / selling.length : 0, notCarried, idle };
  }).sort((a, b) => b.amount - a.amount || b.asked - a.asked);

}

    data: () => { PR.t0 = new Date(Date.now() - 1000).toISOString(); },
    steps: ["rpDepots", "rpBest", "rpBestDepot", "rpType", "rpSku", "rpAsked", "rpDash"] }
);
/* =====================================================================
   VIEW AS — Admin sees the app exactly as another person does, with the
   real data, and can't change anything while doing it.
   ---------------------------------------------------------------------
   The screens are drawn for the chosen person (their role, depot,
   companies, switched-off features). Every save goes through API.run,
   which refuses while viewing, and the fingerprint step refuses too, so
   nothing can be sent in their name. Data is loaded with the Admin's own
   access, then each screen filters it for the chosen person the same way
   it does on their phone. Nothing about it is remembered: a refresh or
   sign-in comes back as the Admin.
   ===================================================================== */
const canViewAs = () => { const real = VIEWAS ? VIEWAS.real : ME; return !!real && (real.role === "admin" || (real.roles || []).includes("admin")); };
function viewAsBar() {
  if (!VIEWAS) return "";
  const dp = ME.depot_id ? idx.depot(ME.depot_id) : null;
  return `<div class="viewas-bar" role="status"><span>👁 Viewing as <b>${esc(ME.full_name)}</b>${ME.sample ? " (sample, no one assigned yet)" : ""} · ${esc(rolesLabel(ME))}${dp ? " · " + esc(dp.name) : ""} — <b>view only</b>, nothing can be changed.</span>
    <span class="row" style="gap:6px"><button class="btn small" onclick="App.viewAsPick()">Someone else</button><button class="btn small primary" onclick="App.viewAsEnd()">Stop viewing</button></span></div>`;
}
function promoPreviewBox() {
  const deps = (S.depots || []).filter(d => !d.is_consolidation_dc).sort((a, b) => (a.company_id || "").localeCompare(b.company_id || "") || a.name.localeCompare(b.name));
  if (!deps.length) return "";
  const promos = (S.users || []).filter(u => u.role === "promodiser").length;
  return `<div class="card stack-sm"><b>📱 Promodiser view</b>
    <p class="small muted">${promos ? "Or see" : "No promodisers have been added yet. You can still see"} what a promodiser sees at any branch: its stock, sales, requests and messages.</p>
    <div class="row" style="gap:8px;flex-wrap:wrap"><select class="in grow" id="va-dep">${deps.map(d => opt(d.id, d.name + (d.company_id ? " · " + d.company_id : ""), "")).join("")}</select>
    <button class="btn primary" onclick="App.viewAsDepot()">View as promodiser</button></div></div>`;
}
Object.assign(App, {
  viewAsPick() {
    if (!canViewAs()) return toast("Only Admin can view the app as someone else", true);
    const real = VIEWAS ? VIEWAS.real : ME, q = (UI.vaQ || "").toLowerCase();
    const people = (S.users || []).filter(u => u.id !== real.id && (!q || (u.full_name + " " + (u.email || "") + " " + rolesLabel(u)).toLowerCase().includes(q)))
      .sort((a, b) => (ROLES[a.role] || "").localeCompare(ROLES[b.role] || "") || a.full_name.localeCompare(b.full_name));
    const where = u => u.depot_id ? [u.depot_id].concat(u.depot_ids || []).map(x => (idx.depot(x) || {}).name || "?").join(" + ") : u.plant_id ? (idx.plant(u.plant_id) || {}).name || "" : u.company_id || "";
    openSheet(`<div class="stack"><div><div class="eyebrow">👁 View as</div><h2>See the app as someone else</h2>
        <p class="small muted">Their screens, with the real data. View only: nothing can be saved, approved or sent while you're viewing.</p></div>
      ${promoPreviewBox()}
      <input class="in" id="va-q" placeholder="Name, email or role" value="${esc(UI.vaQ || "")}" oninput="UI.vaQ=this.value" onchange="App.viewAsPick()" autocomplete="off">
      ${people.length ? `<div class="list">${people.map(u => `<button class="row between pick-row" onclick="App.viewAs('${u.id}')"><div class="grow" style="text-align:left"><b>${esc(u.full_name)}</b>${accessState(u) !== "active" ? ` <span class="chip crit">${esc(accessState(u))}</span>` : ""}
          <div class="small faint">${esc(rolesLabel(u))}${where(u) ? " · " + esc(where(u)) : ""}</div></div><span class="small">View →</span></button>`).join("")}</div>`
        : `<div class="empty">${q ? "No one matches." : "No other people yet. Add them in the Command Center."}</div>`}
      <div class="row"><button class="btn ghost" onclick="closeSheets()">Close</button></div></div>`);
    setTimeout(() => { const i = $("#va-q"); if (i && UI.vaQ) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }, 30);
  },
  /* promodiser screens for a branch, with that branch's real data — works even before any promodiser is added */
  viewAsDepot(depotId) {
    if (!canViewAs()) return;
    const dp = idx.depot(depotId || val("va-dep")); if (!dp) return toast("Choose a branch", true);
    App.viewAs(null, { id: "viewas-" + dp.id, full_name: "Promodiser at " + dp.name, role: "promodiser", depot_id: dp.id, depot_ids: [],
      company_id: dp.company_id, plant_id: null, status: "active", perms: null, sample: true });
  },
  viewAs(uid, given) {
    if (!canViewAs()) return;
    if (PRACTICE) App.practiceEnd(true);
    const u = given || (S.users || []).find(x => x.id === uid); if (!u) return toast("That person isn't loaded", true);
    if (!VIEWAS) VIEWAS = { real: ME, route: UI.route, subs: { ...(UI.subs || {}) }, f: { ...(UI.f || {}) }, apSel: UI.apSel };
    closeSheets(); ME = withWorkingDepot({ ...u }); CACHE = {};
    UI.subs = {}; UI.apSel = null; UI.f = { company: "", account: "", depot: "", range: (VIEWAS.f && VIEWAS.f.range) || 30 };
    UI.route = isPromo() ? "home" : "dashboard";
    render(); window.scrollTo(0, 0);
    toast("Viewing as " + u.full_name + ". View only.");
  },
  viewAsEnd() {
    if (!VIEWAS) return;
    const v = VIEWAS; VIEWAS = null; closeSheets();
    const fresh = (S.users || []).find(x => x.id === v.real.id);
    ME = withWorkingDepot(fresh ? { ...fresh } : v.real); CACHE = {};
    UI.route = v.route; UI.subs = v.subs; UI.f = v.f; UI.apSel = v.apSel;
    render(); window.scrollTo(0, 0); toast("Back to your own view.");
  }
});
/* ---------- theme, install, boot ---------- */
function applyTheme() { if (UI.theme) document.documentElement.setAttribute("data-theme", UI.theme); else document.documentElement.removeAttribute("data-theme"); if (ME) rerender(); }
let deferredInstall = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredInstall = e; });
/* install diagnostics: how this copy was opened, and whether an install finished (written to Setup › Access log) */
const appMode = () => (matchMedia("(display-mode: standalone)").matches || navigator.standalone === true) ? "installed app" : "browser";
const agentStr = () => navigator.userAgent + " | " + appMode();
window.addEventListener("appinstalled", () => { deferredInstall = null; LS.set("shelfsync-installed-at", new Date().toISOString());
  if (typeof SB !== "undefined" && SB && ME) SB.rpc("ss_touch", { p_event: "app_installed", p_agent: agentStr() }).then(() => {}, () => {}); });
window.addEventListener("online", () => { renderSync(); onBackOnline(); });
window.addEventListener("offline", renderSync);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") tick(); });

/* safety net: an error anywhere shows a message with a way out, never a blank screen */
let lastCrash = 0;
function reportCrash(err) {
  console.error(err);
  if (Date.now() - lastCrash < 3000) return; lastCrash = Date.now();
  try { toast("Something went wrong: " + ((err && err.message) || err) + ". Your entries are safe.", true); } catch (e) {}
}
window.addEventListener("error", e => reportCrash(e.error || e.message));
window.addEventListener("unhandledrejection", e => { const r = e.reason; if (r && (r.cancelled || r.name === "AbortError")) return; reportCrash(r); });

let wantReload = false;
/* app updates: a new version waits until the person taps Reload (an install left open for days still gets it) */
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  navigator.serviceWorker.register("sw.js").then(reg => {
    const offer = w => { if (!w || !navigator.serviceWorker.controller) return; showUpdate(() => { wantReload = true; w.postMessage("skip-waiting"); }); };
    if (reg.waiting) offer(reg.waiting);
    reg.addEventListener("updatefound", () => { const w = reg.installing; if (w) w.addEventListener("statechange", () => { if (w.state === "installed") offer(w); }); });
    setInterval(() => reg.update().catch(() => {}), 30 * 60000);
  }).catch(() => {});
  // reload only when the person tapped Reload on the update bar (the first install also changes the controller)
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (wantReload) { wantReload = false; location.reload(); return; }
    if (hadController) showUpdate(() => location.reload());     // a new version took over in the background
  });
}
function showUpdate(go) {
  if (document.getElementById("upd")) return;
  const el = document.createElement("div"); el.id = "upd"; el.className = "update-bar";
  el.innerHTML = `<span>A new version of ShelfSync is ready.</span><button class="btn small primary">Reload</button>`;
  // Reload must always reload: if the waiting version was already replaced, the message to it goes nowhere,
  // so reload anyway after a moment (the page itself always comes fresh from the network)
  el.querySelector("button").onclick = e => { e.currentTarget.disabled = true; e.currentTarget.textContent = "Reloading…";
    const leave = () => location.reload();
    Promise.race([Promise.resolve(Q.read().length ? flushOutbox(true) : null), new Promise(r => setTimeout(r, 3000))]).catch(() => {}).finally(() => { try { go(); } catch (x) {} setTimeout(leave, 1200); }); };
  document.body.appendChild(el);
}

/* live updates from the Plant / depots: only the table that changed is fetched */
let realtime = null, rtKeys = new Set(), rtTimer = null;
const RT_TABLES = { ss_messages: "messages", ss_requests: "requests", ss_documents: "documents", ss_depot_reports: "depot_reports" };
function startRealtime() {
  if (MODE !== "live" || !SB || realtime) return;
  realtime = SB.channel("shelfsync");
  Object.keys(RT_TABLES).forEach(table => realtime.on("postgres_changes", { event: "*", schema: "public", table }, () => {
    rtKeys.add(RT_TABLES[table]); clearTimeout(rtTimer);
    rtTimer = setTimeout(() => { const k = Array.from(rtKeys); rtKeys.clear(); refreshTables(k).catch(() => {}); }, 700);
  }));
  realtime.subscribe();
}
function stopRealtime() { if (realtime && SB) { try { SB.removeChannel(realtime); } catch (e) {} } realtime = null; }
/* while the app is open: what changed every 2 minutes, everything every 30 minutes (in between, only what changed) */
const INC_KEYS = HIST_KEYS;
let lastInc = 0;
function tick() {
  if (MODE !== "live" || !ME || !SB || !navigator.onLine || document.visibilityState !== "visible") return;
  flushOutbox();
  if (Date.now() - LAST_FULL > 30 * 60000) { lastInc = Date.now(); loadLive(true).catch(() => {}); }
  else if (Date.now() - lastInc > 2 * 60000) { lastInc = Date.now(); refreshTables(INC_KEYS).catch(() => {}); }
}
setInterval(tick, 60000);
/* signal is back: reconnect, check the sign-in, send what's waiting, refresh */
async function onBackOnline() {
  if (MODE !== "live" || !ME) return;
  if (!SB) { await initLive(); if (!SB) return; }
  try { await ensureSession(); } catch (e) { Object.assign(SYNC, { ok: false, authNeeded: !!e.authNeeded, reason: friendlyErr(e) }); renderSync(); return; }
  startRealtime(); await flushOutbox(true);
  if (Date.now() - LAST_FULL > 30 * 60000) loadLive(true).catch(() => {}); else refreshTables(INC_KEYS).catch(() => {});
}

/* restore a live session: still asks for Face ID / fingerprint once per app launch */
async function bootLive() {
  let session = null;
  if (SB) { try { const { data } = await SB.auth.getSession(); session = data && data.session; } catch (e) {} }
  if (session) {
    const prof = await liveProfile().catch(e => { toast(friendlyErr(e), true); return null; });
    if (!prof) { if (AUTH.step !== "blocked") { ME = null; render(); } return; }
    if (accessBlocked(prof)) return;
    if (sess.get(BIO_OK) === prof.id) return finishLogin(prof, "resume");
    return afterPassword(prof);
  }
  // no session here: with no signal, open with what's saved on this phone
  const last = LS.get("shelfsync-last-user"), snap = last && !LS.get("shelfsync-signed-out") ? await loadSnapshot(last) : null;
  if (snap && (!navigator.onLine || !SB)) { if (sess.get(BIO_OK) === snap.me.id) return enterOffline(snap); AUTH.step = "offline"; AUTH.snap = snap; render(); return; }
  if (!SB) { AUTH.step = "nolib"; render(); return; }
  ME = null; render();
}

(async function boot() {
  applyTheme();
  if (!DEMO_ALLOWED && await initLive()) {
    S = { users: [], passkeys: [], settings: {} }; render();
    try { await bootLive(); } catch (e) { reportCrash(e); }
    if (SB) SB.auth.onAuthStateChange(ev => { if (ev === "SIGNED_OUT" && ME && navigator.onLine) { Object.assign(SYNC, { ok: false, authNeeded: true, reason: "Signed out" }); renderSync(); } });
    return;
  }
  MODE = "demo";
  S = LS.get(DEMO_KEY);
  if (!S || !S.products || !S.products.length || !S.capacity) { S = buildDemo(); persistDemo(); }
  const u = LS.get("shelfsync-demo-user"), user = u ? S.users.find(x => x.id === u) : null;
  if (user && sess.get(BIO_OK) === user.id && accessState(user) === "active") ME = withWorkingDepot(user);
  render();
})();
</script>
